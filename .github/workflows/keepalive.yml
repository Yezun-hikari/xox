name: Keep Supabase awake

# Free Supabase projects pause after 7 days without database activity.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # values via env, not ${{ }} inside the script: no shell injection from variable contents
      - env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $ANON_KEY" \
            -H "Content-Type: application/json" -d '{}' > /dev/null
