name: Deploy Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0 # keep in sync with `npx supabase --version` (local CLI)
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push --remote
      - run: supabase functions deploy --project-ref "$PROJECT_REF"
